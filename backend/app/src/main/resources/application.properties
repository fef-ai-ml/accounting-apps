spring.application.name=api
server.port=8080

# The API connects as app_runtime, which owns nothing, so Postgres row-level security applies to every query.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_RUNTIME_USER:app_runtime}
spring.datasource.password=${DB_RUNTIME_PASSWORD:app_runtime}

# Flyway migrates as the schema owner.
spring.flyway.user=${DB_USER:app}
spring.flyway.password=${DB_PASSWORD:app}
# Demo data (db/demo, dev profile only) is a repeatable migration; a database that once ran with it must still start
# without it. Missing versioned migrations still fail validation.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Keycloak realm that issues the access tokens. Must equal the "iss" claim exactly (scheme, host, port).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/zk-spring}

# Schemas are owned by each module's Flyway migrations; Hibernate only validates them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
